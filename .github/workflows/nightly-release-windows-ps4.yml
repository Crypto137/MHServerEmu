name: Nightly Release (Windows PS4)

on:
  schedule:
    - cron: '15 7 * * *'

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore MHServerEmu.sln
    - name: Build
      run: dotnet build MHServerEmu.sln --no-restore --configuration "Release PS4"
    - name: Run tests
      run: dotnet test MHServerEmu.sln --no-restore --no-build --configuration "Release PS4"
    - name: Get current date
      run: echo "DATE=$(date +'%Y%m%d')" >> $env:GITHUB_ENV
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MHServerEmu-nightly-${{ env.DATE }}-Release-windows-ps4
        path: |
          ./src/MHServerEmu/bin/Release PS4/net10.0
          !./src/MHServerEmu/bin/Release PS4/net10.0/*.pdb
          !./src/MHServerEmu/bin/Release PS4/net10.0/*.xml
